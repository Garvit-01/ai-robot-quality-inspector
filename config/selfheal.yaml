# Self-Healing Work Cell — all tunables live here.
# Model IDs and base URLs come from the environment (see .env.example).
# NEVER hardcode a model ID or URL in Python. Tier 1 -> Tier 2 must be a config swap only.

run:
  condition: C                   # A | B | C | D  (see SPEC.md §8)
  max_recoveries_per_cycle: 2
  seed_base: 1000
  scenes_per_fault_class: 25     # Tier 1. Tier 2 scales this for training only.

verifier:
  base_url_env: VERIFIER_BASE_URL
  api_key_env: VERIFIER_API_KEY
  model_id_env: VERIFIER_MODEL_ID
  timeout_s: 20
  max_retries: 1                 # one "valid JSON only" nudge, then -> unclear
  temperature: 0.0
  image_longest_side_px: 1024
  jpeg_quality: 85
  # Which views each checkpoint sends. Crops matter more than resolution for
  # small tilts/offsets — this is the main knob for the M2 go/no-go.
  views:
    CP_PRE_GRASP:        [overhead, crop_carrier]
    CP_POST_LIFT:        [overhead, crop_gripper]
    CP_POST_TRANSPORT:   [overhead]
    CP_POST_PLACE:       [overhead, crop_fixture]

planner:
  base_url_env: PLANNER_BASE_URL
  api_key_env: PLANNER_API_KEY
  model_id_env: PLANNER_MODEL_ID
  timeout_s: 20
  temperature: 0.0

# Hard rules applied in code after the model answers. The prompt is not a guardrail.
fusion:
  gripper_empty_threshold_rad: 0.70   # finger joint beyond this => nothing in hand
  gripper_expected_width_rad: 0.42    # nominal closed-on-part width
  gripper_width_tolerance_rad: 0.08

tolerances:
  seated_position_mm: 5.0
  seated_tilt_deg: 3.0

# Reference description given to the verifier so it knows what "correct" looks like.
part_reference:
  correct: "a 50 mm matte grey cube with a flat top face and square, unchipped edges"
  wrong: "any part that is not a 50 mm cube — different size, or a non-cubic shape"
  defective: "a 50 mm cube with a visible defect: a chipped corner, a crack, or a dent"

prompts:
  # Bump on every change; it is recorded in each benchmark run so results stay traceable.
  # v0 -> v1 (tuned on the dev split only, seeds 2000-2059; never on eval 5000-5119):
  #   + a description of the cell, so "where it should be" and "how big" have referents
  #   + the AprilTag as a 50 mm size reference
  #   + per-checkpoint checklists; the transport rule that an empty gripper means dropped
  #   - "centred on the carrier", which was simply wrong: the part's slot is off-centre
  version: v1

  system: |
    You are a quality and process verifier for a robot work cell. You look at camera
    images and answer one question about the current step.
    Answer ONLY with a JSON object matching the schema. No prose, no markdown, no code fences.
    Be conservative: if you cannot see clearly, use failure_type "unclear".

    What the cell looks like:
    - A light-coloured carrier tile on the table. One half holds a black-and-white AprilTag
      marker; the part sits in the other, empty half, square to the tile's edges.
    - The AprilTag's black square is 50 mm wide: the same width as a correct part. Use it as
      a size reference.
    - A dark fixture block with a square pocket. A correctly placed part sits down inside the
      pocket.
    - A red-orange open box: the reject bin.
    - The robot's gripper: a dark palm with two dark fingers pointing down. A held part is
      clamped between the two finger pads.
    - Images are taken from above at an angle, so a cube shows three faces. Do not mistake
      that perspective for a different shape.

  schema_block: |
    Respond with exactly this JSON shape:
    {"checkpoint": "<the checkpoint name given below>",
     "step_ok": <true|false>,
     "failure_type": "<one of the enum values>",
     "evidence": "<one short sentence describing what you actually see>",
     "location_hint": "<one of the enum values>",
     "confidence": <0.0 to 1.0>}

    failure_type must be exactly one of:
      none, empty_grasp, part_displaced, part_dropped_recoverable,
      part_dropped_unrecoverable, misaligned_seat, wrong_part, defective_part, unclear

    location_hint must be exactly one of:
      gripper, carrier, table_in_reach, table_out_of_reach, off_table, fixture,
      reject_bin, unknown

  checkpoints:
    CP_PRE_GRASP: |
      Checkpoint: CP_PRE_GRASP. The robot is about to grasp the part waiting on the carrier.
      The correct part is: {correct}.
      Check, in this order, and report the FIRST problem you find:
      1. Shape and size: is it a cube about as wide as the AprilTag's black square? A
         cylinder, a tall block, or a clearly smaller cube is wrong_part.
      2. Damage: look at every corner and edge. A corner that is cut off, a small slanted
         facet, a bright bare-metal patch, or a dark crack line is defective_part.
      3. Position: it should sit squarely in the empty half of the carrier, beside the tag,
         edges parallel to the carrier's edges. Clearly shifted toward an edge or the tag,
         or visibly rotated, is part_displaced.
      If all three are fine: step_ok true, failure_type none.
      location_hint is carrier in every case.

    CP_POST_LIFT: |
      Checkpoint: CP_POST_LIFT. The robot has just closed its gripper and lifted it.
      Question: is the part held between the two finger pads?
      Look at the space between the fingers. If the part is clamped there, it is held:
      failure_type none, location_hint gripper.
      If the fingers are closed together with nothing between them, and the part is still
      sitting on the carrier below, the grasp missed: empty_grasp, location_hint carrier.

    CP_POST_TRANSPORT: |
      Checkpoint: CP_POST_TRANSPORT. The robot has carried the part to a point above the
      fixture. The part WAS lifted successfully earlier, so an empty gripper here always means
      the part was dropped on the way. Never answer empty_grasp at this checkpoint.
      - Part clamped between the finger pads: none, location_hint gripper.
      - Gripper empty and the part is lying on the table: part_dropped_recoverable,
        location_hint table_in_reach.
      - Gripper empty and the part is nowhere to be seen in the cell: it fell off the table.
        part_dropped_unrecoverable, location_hint off_table.

    CP_POST_PLACE: |
      Checkpoint: CP_POST_PLACE. The robot has released the part into the fixture pocket and
      moved away.
      Question: is the part correctly seated?
      Correctly seated: down inside the pocket, top face level, edges parallel to the pocket
      walls, a similar gap all round.
      misaligned_seat: tilted (one edge or corner higher than the other), resting on the rim
      or a wall, or sitting noticeably higher than a seated part would.
      location_hint is fixture in every case.

# Only for reporting cost in results.md. Update from the live Nebius console before runs.
pricing:
  planner_usd_per_1m_input: null
  planner_usd_per_1m_output: null
  verifier_usd_per_1m_input: null
  verifier_usd_per_1m_output: null
  verifier_endpoint_usd_per_hour: null
